<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сенсорная панель с масштабированием</title>
    <style>
        /* ===== Сброс и базовые стили ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --scale: 1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* ===== Основной контейнер панели ===== */
        .panel {
            width: 15cm;
            height: 5cm;
            background: linear-gradient(145deg, #16213e, #0f3460);
            border-radius: 12px;
            padding: 0.25cm;
            display: flex;
            flex-direction: column;
            gap: 0.15cm;
            box-shadow:
                    0 0 20px rgba(0, 150, 255, 0.15),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(100, 180, 255, 0.15);
            transform: scale(var(--scale));
            transform-origin: center center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== Область кнопок (3 ряда × 3 колонки) ===== */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.12cm;
            flex: 1;
        }

        /* ===== Стили кнопок ===== */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #1a3a6a 0%, #0d2240 100%);
            border: 1px solid rgba(100, 180, 255, 0.25);
            border-radius: 8px;
            color: #a0cfff;
            font-size: 9pt;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(100, 180, 255, 0.3);
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
            border-radius: 8px 8px 0 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .btn:hover {
            background: linear-gradient(180deg, #2a5aaa 0%, #1a3d7a 100%);
            border-color: rgba(100, 200, 255, 0.6);
            color: #ffffff;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.8);
            box-shadow:
                    0 0 12px rgba(50, 150, 255, 0.4),
                    0 0 25px rgba(50, 150, 255, 0.15),
                    inset 0 0 15px rgba(50, 150, 255, 0.1);
            transform: scale(1.03);
        }

        .btn:hover::before {
            opacity: 0.8;
        }

        .btn:active {
            transform: scale(0.97);
            background: linear-gradient(180deg, #3060b0 0%, #204080 100%);
            box-shadow:
                    0 0 8px rgba(50, 150, 255, 0.6),
                    inset 0 2px 4px rgba(0, 0, 0, 0.3);
            transition-duration: 0.08s;
        }

        .btn-icon {
            font-size: 12pt;
            margin-right: 0.15cm;
            filter: drop-shadow(0 0 3px rgba(100, 180, 255, 0.4));
        }

        /* ===== Область подсказки + кнопки масштаба ===== */
        .tooltip-area {
            width: 100%;
            height: calc((100% - 0.3cm - 0.24cm) / 3 * 1.5);
            min-height: 0.7cm;
            background: linear-gradient(180deg, rgba(10, 25, 50, 0.95), rgba(5, 15, 35, 0.98));
            border: 1px solid rgba(80, 160, 255, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.2cm;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .tooltip-text {
            color: rgba(150, 210, 255, 0.5);
            font-size: 8.5pt;
            font-style: italic;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
            flex: 1;
        }

        .tooltip-text.active {
            color: #7fdbff;
            text-shadow: 0 0 8px rgba(100, 200, 255, 0.5);
            font-style: normal;
            font-weight: 500;
            animation: fadeInUp 0.25s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Кнопки переключения масштаба ===== */
        .scale-controls {
            display: flex;
            gap: 0.12cm;
            align-items: center;
            margin-left: 0.15cm;
            flex-shrink: 0;
        }

        .scale-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 30, 60, 0.9);
            border: 1px solid rgba(100, 180, 255, 0.25);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #6aa8d8;
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        .scale-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
            pointer-events: none;
        }

        /* Размеры кнопок от малой к большой */
        .scale-btn:nth-child(1) { width: 22px; height: 22px; }
        .scale-btn:nth-child(2) { width: 28px; height: 28px; }
        .scale-btn:nth-child(3) { width: 34px; height: 34px; }
        .scale-btn:nth-child(4) { width: 40px; height: 40px; }

        .scale-btn:hover {
            background: rgba(30, 60, 120, 0.9);
            border-color: rgba(100, 200, 255, 0.6);
            color: #b8e0ff;
            box-shadow: 0 0 8px rgba(50, 150, 255, 0.3);
        }

        .scale-btn.active {
            background: linear-gradient(180deg, #1e4a8a 0%, #0d2a55 100%);
            border-color: rgba(100, 220, 255, 0.8);
            color: #ffffff;
            box-shadow:
                    0 0 10px rgba(50, 180, 255, 0.5),
                    inset 0 0 8px rgba(50, 150, 255, 0.15);
        }

        .scale-btn .monitor-icon {
            width: 70%;
            height: 70%;
            transition: transform 0.2s ease;
        }

        .scale-btn:hover .monitor-icon {
            transform: scale(1.1);
        }

        /* ===== Разделитель между подсказкой и кнопками ===== */
        .scale-divider {
            width: 1px;
            height: 60%;
            background: rgba(100, 180, 255, 0.15);
            margin: 0 0.1cm;
            flex-shrink: 0;
        }

        /* ===== Пульсация рамки панели ===== */
        @keyframes borderPulse {
            0%, 100% { border-color: rgba(100, 180, 255, 0.15); }
            50% { border-color: rgba(100, 180, 255, 0.3); }
        }

        .panel {
            animation: borderPulse 4s ease-in-out infinite;
        }

        /* ===== Индикатор текущего разрешения ===== */
        .resolution-label {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: rgba(100, 180, 255, 0.4);
            font-size: 10pt;
            font-family: monospace;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="panel" id="panel">
    <!-- Сетка кнопок 3×3 -->
    <div class="buttons-grid">
        <div class="btn" data-hint="Запуск главного меню системы">
            <span class="btn-icon">🏠</span> Меню
        </div>
        <div class="btn" data-hint="Настройки параметров устройства">
            <span class="btn-icon">⚙️</span> Настройки
        </div>
        <div class="btn" data-hint="Просмотр системных уведомлений">
            <span class="btn-icon">🔔</span> Уведомления
        </div>
        <div class="btn" data-hint="Управление файлами и документами">
            <span class="btn-icon">📁</span> Файлы
        </div>
        <div class="btn" data-hint="Мониторинг состояния системы">
            <span class="btn-icon">📊</span> Монитор
        </div>
        <div class="btn" data-hint="Сетевые подключения и Wi-Fi">
            <span class="btn-icon">🌐</span> Сеть
        </div>
        <div class="btn" data-hint="Журнал событий и логирование">
            <span class="btn-icon">📋</span> Журнал
        </div>
        <div class="btn" data-hint="Безопасность и авторизация">
            <span class="btn-icon">🔒</span> Защита
        </div>
        <div class="btn" data-hint="Справка и руководство пользователя">
            <span class="btn-icon">❓</span> Помощь
        </div>
    </div>

    <!-- Область подсказки + кнопки масштаба -->
    <div class="tooltip-area">
        <span class="tooltip-text" id="tooltip">Наведите на кнопку для подсказки</span>
        <div class="scale-divider"></div>
        <div class="scale-controls">
            <!-- Кнопка 1: 1920×1080 (Full HD) — масштаб 1.0 -->
            <button class="scale-btn active" data-scale="1" title="1920×1080 (Full HD)">
                <svg viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="monitor-icon">
                    <rect x="3" y="2" width="26" height="14" rx="2" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="16" y1="16" x2="16" y2="20" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="10" y1="20.5" x2="22" y2="20.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- Кнопка 2: 2560×1440 (QHD) — масштаб 1.333 -->
            <button class="scale-btn" data-scale="1.333" title="2560×1440 (QHD)">
                <svg viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="monitor-icon">
                    <rect x="3" y="2" width="26" height="14" rx="2" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="16" y1="16" x2="16" y2="20" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="10" y1="20.5" x2="22" y2="20.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- Кнопка 3: 3200×1800 (QHD+) — масштаб 1.667 -->
            <button class="scale-btn" data-scale="1.667" title="3200×1800 (QHD+)">
                <svg viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="monitor-icon">
                    <rect x="3" y="2" width="26" height="14" rx="2" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="16" y1="16" x2="16" y2="20" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="10" y1="20.5" x2="22" y2="20.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- Кнопка 4: 3840×2160 (4K UHD) — масштаб 2.0 -->
            <button class="scale-btn" data-scale="2" title="3840×2160 (4K UHD)">
                <svg viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="monitor-icon">
                    <rect x="3" y="2" width="26" height="14" rx="2" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="16" y1="16" x2="16" y2="20" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="10" y1="20.5" x2="22" y2="20.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- Индикатор текущего разрешения -->
<div class="resolution-label" id="resLabel">1920×1080</div>

<script>
    // ===== Подсказки для кнопок =====
    const buttons = document.querySelectorAll('.btn');
    const tooltip = document.getElementById('tooltip');

    buttons.forEach(btn => {
        btn.addEventListener('mouseenter', () => {
            const hint = btn.getAttribute('data-hint');
            tooltip.textContent = hint;
            tooltip.classList.add('active');
        });

        btn.addEventListener('mouseleave', () => {
            tooltip.textContent = 'Наведите на кнопку для подсказки';
            tooltip.classList.remove('active');
        });

        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const hint = btn.getAttribute('data-hint');
            tooltip.textContent = hint;
            tooltip.classList.add('active');
            btn.style.transform = 'scale(0.97)';
        });

        btn.addEventListener('touchend', () => {
            btn.style.transform = '';
            setTimeout(() => {
                tooltip.textContent = 'Наведите на кнопку для подсказки';
                tooltip.classList.remove('active');
            }, 2000);
        });
    });

    // ===== Переключение масштаба =====
    const scaleButtons = document.querySelectorAll('.scale-btn');
    const panel = document.getElementById('panel');
    const resLabel = document.getElementById('resLabel');

    const resolutionMap = {
        '1': '1920×1080',
        '1.333': '2560×1440',
        '1.667': '3200×1800',
        '2': '3840×2160'
    };

    scaleButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const scale = btn.getAttribute('data-scale');

            // Устанавливаем масштаб через CSS переменную
            document.documentElement.style.setProperty('--scale', scale);

            // Обновляем активную кнопку
            scaleButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Обновляем индикатор разрешения
            resLabel.textContent = resolutionMap[scale] || scale;
        });

        // Поддержка сенсорных экранов
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            btn.click();
        });
    });
</script>

</body>
</html>
